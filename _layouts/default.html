<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  {% assign bodyClass = page.bodyClass | default: layout.bodyClass %}
  <body{% if bodyClass %} class="{{ bodyClass }}"{% endif %}>

    {% include header.html %}

    {% if page.includeBanner %}
        {% include banner.html %}
    {% endif %}

    <div class="content">
      <section id="content">
        {{ content }}
      </section>
    </div>

    {% include footer.html %}

  </body>

</html>
